[project]
name = "a-share-factor-research-agent"
version = "0.1.0"
description = "A-share factor research agent for extracting, validating, and backtesting factor hypotheses."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "pydantic-settings",
  "python-dotenv",
  "python-multipart",
  "pandas",
  "numpy",
  "scipy",
  "akshare",
  "openai",
  "langgraph",
  "pypdf",
  "markdown",
  "beautifulsoup4",
  "requests",
  "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
embedding = ["chromadb", "sentence-transformers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data_cache*", "run_artifacts*", "uploaded_docs*", "fixture_docs*", "tests*"]

[tool.ruff]
line-length = 100
